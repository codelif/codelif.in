# Builds with a pinned Zola binary rather than Cloudflare Pages' built-in
# Zola, whose version lags. Needs two repo secrets:
#   CLOUDFLARE_API_TOKEN   (Pages: Edit)
#   CLOUDFLARE_ACCOUNT_ID
name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  ZOLA_VERSION: "0.23.3"

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install zola
        run: |
          curl -sSL -o zola.tar.gz \
            "https://github.com/getzola/zola/releases/download/v${ZOLA_VERSION}/zola-v${ZOLA_VERSION}-x86_64-unknown-linux-gnu.tar.gz"
          tar xzf zola.tar.gz
          sudo mv zola /usr/local/bin/

      - name: Build
        run: |
          zola check
          zola build

      - name: Deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy public --project-name=codelif-in --branch=main
